<body>
<h1>IT Preventive Maintenance</h1>

<!-- HOME -->
<div id="home" class="view active">
  <div class="home">
    <img src="Logo.png" alt="Logo" class="logo-home">
    <h2>ระบบเช็คงาน Preventive Maintenance</h2>
    <div class="home-buttons">
      <button class="btn primary" onclick="go('month')">📋 เช็คงานรายเดือน</button>
      <button class="btn" onclick="go('remote')">🖥️ Remote User</button>
      <button class="btn" onclick="go('devices')">⚙️ จัดการรายการเครื่อง</button>
      <button class="btn" onclick="go('year')">📅 ดูตารางทั้งปี</button>
    </div>
  </div>
</div>

<!-- MONTH VIEW -->
<div id="month" class="view">
  <button class="back-btn" onclick="go('home')">← กลับหน้าแรก</button>
  <div class="month-controls">
    <label>เลือกเดือน: </label>
    <select id="monthSelect" onchange="renderMonthTasks()"></select>
    <input type="text" id="searchBox" class="search-box" placeholder="ค้นหาชื่อเครื่อง..." oninput="renderMonthTasks()">
  </div>
  <div class="filter-bar">
    <button class="filter-btn active" id="filterPending" onclick="setFilter('pending')">ยังไม่เช็ค</button>
    <button class="filter-btn" id="filterDone" onclick="setFilter('done')">เช็คแล้ว</button>
  </div>
  <div class="month-actions">
    <button class="check-all-btn" onclick="checkAllMonth()">เช็คทั้งหมดของเดือนนี้</button>
  </div>
  <div id="monthContent"></div>
</div>

<!-- REMOTE VIEW -->
<div id="remote" class="view">
  <button class="back-btn" onclick="go('home')">← กลับหน้าแรก</button>
  <h3 class="section-title">Remote User</h3>
  <p style="text-align:center; color:#64748b; margin-bottom:16px;">เลือกเครื่องที่ต้องการรีโมท</p>
  <div id="remoteList" class="device-list"></div>
</div>
<div id="devices" class="view">
  <button class="back-btn" onclick="go('home')">← กลับหน้าแรก</button>
  <h3 class="section-title">คอมพิวเตอร์ (PC / NB)</h3>
  <div id="pcList" class="device-list"></div>
  <button class="btn add-btn" onclick="addDevice('pc')">+ เพิ่มเครื่อง PC</button>

  <h3 class="section-title">เครื่องปริ้นเตอร์</h3>
  <div id="printerList" class="device-list"></div>
  <button class="btn add-btn" onclick="addDevice('printer')">+ เพิ่มเครื่องปริ้น</button>
</div>

<!-- YEAR VIEW -->
<div id="year" class="view">
  <button class="back-btn" onclick="go('home')">← กลับหน้าแรก</button>
  <div class="legend">
    <span><i class="dot" style="background:#1e40af"></i> Plan</span>
    <span><i class="dot" style="background:#16a34a"></i> Checked</span>
  </div>
  <div class="year-container">
    <table id="yearTable"></table>
  </div>
</div>

<div id="toast" class="toast">ลงข้อมูลแล้ว</div>

<script>
const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

// Default devices
let pcs = JSON.parse(localStorage.getItem('pcs') || 'null') || Array.from({length:32}, (_,i) => ({
  id: i+1,
  name: `PC-${String(i+1).padStart(2,'0')}`,
  anydeskId: '',
  unattended: false,
  note: ''
}));
let printers = JSON.parse(localStorage.getItem('printers') || 'null') || Array.from({length:15}, (_,i) => ({id:i+1, name:`Printer-${i+1}`}));

// Per-device checked state: key = `${type}-${deviceId}-${task}-${month}`
let checks = JSON.parse(localStorage.getItem('deviceChecks') || '{}');

function saveDevices() {
  localStorage.setItem('pcs', JSON.stringify(pcs));
  localStorage.setItem('printers', JSON.stringify(printers));
}
function saveChecks() {
  localStorage.setItem('deviceChecks', JSON.stringify(checks));
}

function go(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(view).classList.add('active');
  if (view === 'devices') renderDevices();
  if (view === 'month') renderMonthTasks();
  if (view === 'year') buildYearTable();
  if (view === 'remote') renderRemote();
}

function renderRemote() {
  const container = document.getElementById('remoteList');
  container.innerHTML = '';
  const remotePcs = pcs.filter(d => d.anydeskId);
  if (remotePcs.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#64748b;grid-column:1/-1;">ยังไม่มีเครื่องที่กรอก AnyDesk ID<br>ไปที่หน้าจัดการรายการเครื่องเพื่อเพิ่ม</p>';
    return;
  }
  remotePcs.forEach(d => {
    const card = document.createElement('div');
    card.className = 'device-card remote-card';
    card.innerHTML = `
      <h4>${d.name}</h4>
      <div class="id-text">AnyDesk: ${d.anydeskId}</div>
      ${d.unattended ? '<div style="color:#16a34a;font-size:13px;font-weight:600;">✓ Unattended</div>' : ''}
      ${d.note ? `<div style="font-size:13px;color:#475569;">${d.note}</div>` : ''}
      <a href="anydesk:${d.anydeskId}" class="remote-btn">รีโมทตอนนี้</a>
    `;
    container.appendChild(card);
  });
}

function renderDevices() {
  const pcContainer = document.getElementById('pcList');
  pcContainer.innerHTML = '';
  pcs.forEach((d, idx) => {
    const card = document.createElement('div');
    card.className = 'device-card';
    card.style.minWidth = '220px';
    card.innerHTML = `
      <input type="text" value="${d.name}" placeholder="ชื่อเครื่อง" onchange="pcs[${idx}].name=this.value; saveDevices()">
      <input type="text" value="${d.anydeskId || ''}" placeholder="AnyDesk ID" onchange="pcs[${idx}].anydeskId=this.value; saveDevices()">
      <label>
        <input type="checkbox" ${d.unattended ? 'checked' : ''} onchange="pcs[${idx}].unattended=this.checked; saveDevices()">
        เปิด Unattended แล้ว
      </label>
      <input type="text" value="${d.note || ''}" placeholder="หมายเหตุ" onchange="pcs[${idx}].note=this.value; saveDevices()">
      ${d.anydeskId ? `<a href="anydesk:${d.anydeskId}" class="remote-btn">รีโมท</a>` : ''}
      <button class="delete-btn" onclick="confirmDelete('pc', ${idx})">ลบ</button>
    `;
    pcContainer.appendChild(card);
  });

  const prnContainer = document.getElementById('printerList');
  prnContainer.innerHTML = '';
  printers.forEach((d, idx) => {
    const card = document.createElement('div');
    card.className = 'device-card';
    card.innerHTML = `
      <input value="${d.name}" onchange="printers[${idx}].name=this.value; saveDevices()">
      <button onclick="confirmDelete('printer', ${idx})" style="background:#fee2e2;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;">ลบ</button>
    `;
    prnContainer.appendChild(card);
  });
}

function confirmDelete(type, idx) {
  const name = type === 'pc' ? pcs[idx].name : printers[idx].name;
  if (confirm(`ต้องการลบ "${name}" ใช่หรือไม่?`)) {
    if (type === 'pc') pcs.splice(idx, 1);
    else printers.splice(idx, 1);
    saveDevices();
    renderDevices();
  }
}

function addDevice(type) {
  if (type === 'pc') {
    const n = pcs.length + 1;
    pcs.push({id: Date.now(), name: `PC-${String(n).padStart(2,'0')}`, anydeskId: '', unattended: false, note: ''});
  } else {
    const n = printers.length + 1;
    printers.push({id: Date.now(), name: `Printer-${n}`});
  }
  saveDevices();
  renderDevices();
}

// Year plan data
const yearMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const weeks = ['W1','W2','W3','W4'];
const yearTasks = [
  { id:1, name:'ตรวจสอบหมึกเครื่องปริ้นเตอร์', freq:'Yearly', plan:[{m:0,w:0},{m:5,w:2},{m:11,w:3}] },
  { id:2, name:'ตรวจสอบทรัพย์สินของแผนก', freq:'Yearly', plan:[{m:0,w:0},{m:5,w:2},{m:11,w:3}] },
  { id:3, name:'ตรวจเช็คการทำงานของเครื่องเซิร์ฟเวอร์', freq:'4 month', plan:[{m:1,w:1},{m:1,w:2},{m:5,w:1},{m:5,w:2},{m:11,w:2},{m:11,w:3}] },
  { id:4, name:'ตรวจเช็คคุณภาพแบตเตอรี่ใน UPS', freq:'4 month', plan:[{m:1,w:1},{m:1,w:2},{m:5,w:1},{m:5,w:2},{m:11,w:2},{m:11,w:3}] },
  { id:5, name:'Cleaning dust (Desktop PC)', freq:'6 month', plan:[{m:5,w:0},{m:5,w:1},{m:5,w:2},{m:11,w:0},{m:11,w:1},{m:11,w:2},{m:11,w:3}] },
  { id:6, name:'ทำความสะอาดหัวพิมพ์ Epson', freq:'6 month', plan:[{m:5,w:0},{m:5,w:1},{m:5,w:2},{m:11,w:0},{m:11,w:1},{m:11,w:2},{m:11,w:3}] },
  { id:7, name:'ตรวจเช็คโปรแกรมแพลทฟอร์มในเครื่อง PC & NB', freq:'Quarter', plan:[{m:1,w:0},{m:1,w:1},{m:1,w:2},{m:4,w:0},{m:4,w:1},{m:4,w:2},{m:7,w:0},{m:7,w:1},{m:7,w:2},{m:10,w:0},{m:10,w:1},{m:10,w:2}] },
  { id:8, name:'ตรวจเช็คการอัปเดท Window & Driver', freq:'Quarter', plan:[{m:1,w:0},{m:1,w:1},{m:1,w:2},{m:4,w:0},{m:4,w:1},{m:4,w:2},{m:7,w:0},{m:7,w:1},{m:7,w:2},{m:10,w:0},{m:10,w:1},{m:10,w:2}] },
  { id:9, name:'ตรวจเช็คการทำงานเครื่องปริ้นเตอร์', freq:'Quarter', plan:[{m:1,w:0},{m:1,w:1},{m:1,w:2},{m:4,w:0},{m:4,w:1},{m:4,w:2},{m:7,w:0},{m:7,w:1},{m:7,w:2},{m:10,w:0},{m:10,w:1},{m:10,w:2}] },
  { id:10, name:'ตรวจเช็ค Scanner Barcode', freq:'Quarter', plan:[{m:1,w:0},{m:1,w:1},{m:1,w:2},{m:4,w:0},{m:4,w:1},{m:4,w:2},{m:7,w:0},{m:7,w:1},{m:7,w:2},{m:10,w:0},{m:10,w:1},{m:10,w:2}] },
  { id:11, name:'ตรวจเช็คอุปกรณ์ที่ใช้ร่วมกับคอมพิวเตอร์', freq:'Quarter', plan:[{m:1,w:0},{m:1,w:1},{m:1,w:2},{m:4,w:0},{m:4,w:1},{m:4,w:2},{m:7,w:0},{m:7,w:1},{m:7,w:2},{m:10,w:0},{m:10,w:1},{m:10,w:2}] },

  { id:13, name:'ทำการแบ็คอัพไฟล์กลาง', freq:'Monthly', plan:[{m:0,w:0},{m:1,w:0},{m:3,w:0},{m:4,w:0},{m:5,w:0},{m:6,w:0},{m:7,w:0},{m:8,w:0},{m:9,w:0},{m:10,w:0},{m:11,w:0}] },
  { id:14, name:'Backup data SML', freq:'Daily', plan: yearMonths.map((_,i)=>[{m:i,w:0},{m:i,w:1},{m:i,w:2},{m:i,w:3}]).flat() },
  { id:15, name:'Support User', freq:'Daily', plan: yearMonths.map((_,i)=>[{m:i,w:0},{m:i,w:1},{m:i,w:2},{m:i,w:3}]).flat() },
];

let yearState = JSON.parse(localStorage.getItem('pmState') || '{}');

function buildYearTable() {
  const table = document.getElementById('yearTable');
  if (!table) return;
  let html = '<thead><tr><th rowspan="2">Schedule</th><th rowspan="2">Task</th>';
  yearMonths.forEach(m => html += `<th colspan="4">${m}-24</th>`);
  html += '</tr><tr>';
  yearMonths.forEach(() => weeks.forEach(w => html += `<th>${w}</th>`));
  html += '</tr></thead><tbody>';

  const groups = {};
  yearTasks.forEach(t => {
    if (!groups[t.freq]) groups[t.freq] = [];
    groups[t.freq].push(t);
  });

  for (const [freq, list] of Object.entries(groups)) {
    list.forEach((task, idx) => {
      html += '<tr>';
      if (idx === 0) html += `<td class="freq" rowspan="${list.length}">${freq}</td>`;
      html += `<td class="task-name" title="${task.name}">${task.name}</td>`;
      yearMonths.forEach((_, mi) => {
        weeks.forEach((_, wi) => {
          const planned = task.plan.some(p => p.m === mi && p.w === wi);
          const checked = !!yearState[`${task.id}-${mi}-${wi}`];
          let cls = 'empty';
          if (planned && checked) cls = 'checked';
          else if (planned) cls = 'plan';
          html += `<td class="cell ${cls}"></td>`;
        });
      });
      html += '</tr>';
    });
  }
  html += '</tbody>';
  table.innerHTML = html;
}
const pcTasks = [
  'Cleaning dust (Desktop PC)',
  'ตรวจเช็คโปรแกรมแปลกปลอมในเครื่อง PC & NB',
  'Clean & Clear temp'
];
const printerTasks = [
  'ตรวจสอบสต็อคหมึกเครื่องปริ้นเตอร์',
  'ทำความสะอาดที่ซับหมึกเคลียร์ซับหมึก เครื่องปริ้น Epson / Brother',
  'ตรวจเช็คการทำงานเครื่องปริ้นเตอร์',
  'ตรวจเช็ค Scanner Barcode',
  'ตรวจเช็คการทำงานอุปกรณ์ที่ใช้ร่วมกับคอมพิวเตอร์'
];

let currentFilter = 'pending';

function setFilter(f) {
  currentFilter = f;
  document.getElementById('filterPending').classList.toggle('active', f === 'pending');
  document.getElementById('filterDone').classList.toggle('active', f === 'done');
  renderMonthTasks();
}

function renderMonthTasks() {
  const sel = document.getElementById('monthSelect');
  if (!sel.options.length) {
    months.forEach((m, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = m + ' 2024';
      sel.appendChild(opt);
    });
    sel.value = new Date().getMonth();
  }
  const month = +sel.value;
  const search = (document.getElementById('searchBox')?.value || '').toLowerCase().trim();
  const container = document.getElementById('monthContent');
  container.innerHTML = '';

  // Helper to count progress
  function getProgress(devices, typePrefix, task) {
    const total = devices.length;
    const done = devices.filter(d => checks[`${typePrefix}-${d.id}-${task}-${month}`]).length;
    return { done, total };
  }

  // PC section
  const pcTitle = document.createElement('h3');
  pcTitle.className = 'section-title';
  pcTitle.textContent = `คอมพิวเตอร์ (${pcs.length} เครื่อง)`;
  container.appendChild(pcTitle);

  pcTasks.forEach(task => {
    const prog = getProgress(pcs, 'pc', task);
    const header = document.createElement('div');
    header.className = 'task-header';
    header.innerHTML = `
      <div class="task-title">💻 ${task} <span class="progress">เช็คไปแล้ว ${prog.done}/${prog.total}</span></div>
      <button class="check-all-btn" onclick="checkAll('${task}', 'pc', ${month})">เช็คแล้วทุกเครื่อง</button>
    `;
    container.appendChild(header);

    const list = document.createElement('div');
    list.className = 'device-list';
    pcs.forEach(d => {
      if (search && !d.name.toLowerCase().includes(search)) return;
      const key = `pc-${d.id}-${task}-${month}`;
      const isChecked = !!checks[key];
      if (currentFilter === 'pending' && isChecked) return;
      if (currentFilter === 'done' && !isChecked) return;
      const card = document.createElement('div');
      card.className = 'device-card check-card';
      card.innerHTML = `
        <div class="emoji">💻</div>
        <div class="check-dot ${isChecked ? 'checked' : ''}"></div>
        <span>${d.name}</span>
      `;
      card.querySelector('.check-dot').addEventListener('click', () => toggleCheck(key, card));
      list.appendChild(card);
    });
    container.appendChild(list);
  });

  // Printer section
  const prnTitle = document.createElement('h3');
  prnTitle.className = 'section-title';
  prnTitle.textContent = `เครื่องปริ้นเตอร์ (${printers.length} เครื่อง)`;
  container.appendChild(prnTitle);

  printerTasks.forEach(task => {
    const prog = getProgress(printers, 'prn', task);
    const header = document.createElement('div');
    header.className = 'task-header';
    header.innerHTML = `
      <div class="task-title">🖨️ ${task} <span class="progress">เช็คไปแล้ว ${prog.done}/${prog.total}</span></div>
      <button class="check-all-btn" onclick="checkAll('${task}', 'prn', ${month})">เช็คแล้วทุกเครื่อง</button>
    `;
    container.appendChild(header);

    const list = document.createElement('div');
    list.className = 'device-list';
    printers.forEach(d => {
      if (search && !d.name.toLowerCase().includes(search)) return;
      const key = `prn-${d.id}-${task}-${month}`;
      const isChecked = !!checks[key];
      if (currentFilter === 'pending' && isChecked) return;
      if (currentFilter === 'done' && !isChecked) return;
      const card = document.createElement('div');
      card.className = 'device-card check-card';
      card.innerHTML = `
        <div class="emoji">🖨️</div>
        <div class="check-dot ${isChecked ? 'checked' : ''}"></div>
        <span>${d.name}</span>
      `;
      card.querySelector('.check-dot').addEventListener('click', () => toggleCheck(key, card));
      list.appendChild(card);
    });
    container.appendChild(list);
  });
}

function checkAll(task, type, month) {
  const devices = type === 'pc' ? pcs : printers;
  const prefix = type === 'pc' ? 'pc' : 'prn';
  if (!confirm(`ต้องการเช็ค "${task}" ให้ครบทุกเครื่องใช่หรือไม่?`)) return;
  devices.forEach(d => {
    const key = `${prefix}-${d.id}-${task}-${month}`;
    checks[key] = true;
  });
  saveChecks();
  const toast = document.getElementById('toast');
  toast.textContent = 'เช็คครบทุกเครื่องแล้ว';
  toast.classList.add('show');
  setTimeout(() => {
    toast.classList.remove('show');
    toast.textContent = 'ลงข้อมูลแล้ว';
  }, 1200);
  renderMonthTasks();
}

function toggleCheck(key, card) {
  checks[key] = !checks[key];
  saveChecks();
  const toast = document.getElementById('toast');
  toast.textContent = checks[key] ? 'ลงข้อมูลแล้ว' : 'ยกเลิกการเช็คแล้ว';
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 900);
  renderMonthTasks();
}

function checkAllMonth() {
  const month = +document.getElementById('monthSelect').value;
  if (!confirm('ต้องการเช็คทุกงานของเดือนนี้ให้ครบทุกเครื่องใช่หรือไม่?')) return;
  [...pcTasks, ...printerTasks].forEach(task => {
    const devices = pcTasks.includes(task) ? pcs : printers;
    const prefix = pcTasks.includes(task) ? 'pc' : 'prn';
    devices.forEach(d => {
      checks[`${prefix}-${d.id}-${task}-${month}`] = true;
    });
  });
  saveChecks();
  renderMonthTasks();
}

// Init
document.getElementById('monthSelect').addEventListener('change', renderMonthTasks);
</script>
